[package]
name = "pocketlog-server"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
publish = false

[dependencies]
getrandom = "0.4"
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["jpeg"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
axum = "0.8"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
rusqlite = { version = "0.42", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "time", "sync"] }
tower = { version = "0.5", features = ["util"] }

[dev-dependencies]
http-body-util = "0.1"

[profile.release]
strip = true
lto = "thin"
