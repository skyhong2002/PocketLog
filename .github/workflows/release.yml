name: release
# Builds a signed release APK for a version tag and attaches it to a GitHub release.
# The app's update checker reads that release (asset name carries the versionCode, and
# GitHub publishes each asset's SHA-256 digest, which the app verifies before installing).
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - name: Build signed release APK
        working-directory: android
        env:
          KEYSTORE_BASE64: ${{ secrets.POCKETLOG_KEYSTORE_BASE64 }}
          POCKETLOG_KEYSTORE_PASSWORD: ${{ secrets.POCKETLOG_KEYSTORE_PASSWORD }}
          POCKETLOG_KEY_ALIAS: ${{ secrets.POCKETLOG_KEY_ALIAS }}
          POCKETLOG_KEY_PASSWORD: ${{ secrets.POCKETLOG_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "POCKETLOG_KEYSTORE_BASE64 secret is missing" >&2; exit 1; }
          export POCKETLOG_KEYSTORE="$RUNNER_TEMP/release.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$POCKETLOG_KEYSTORE"
          ./gradlew --no-daemon testReleaseUnitTest :app:assembleRelease
          rm -f "$POCKETLOG_KEYSTORE"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          apk=android/app/build/outputs/apk/release/app-release.apk
          code=$("$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$apk" | sed -n "s/.*versionCode='\([0-9]*\)'.*/\1/p")
          name="PocketLog-${TAG#v}-${code}.apk"
          cp "$apk" "$name"
          sha256sum "$name" > "$name.sha256"
          gh release create "$TAG" "$name" "$name.sha256" --title "PocketLog ${TAG#v}" --generate-notes --verify-tag
