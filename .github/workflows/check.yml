name: checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: node --check server/web/app.js && node scripts/test-web-timeline.cjs
  server:
    runs-on: ubuntu-latest
    container: rust:1-bookworm@sha256:ade39a710ef85f3506cffcfec3e8a24ba090badef1dff2fb798f71d878833fea
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup component add rustfmt clippy
      - run: cargo fmt --check && cargo clippy --locked --all-targets -- -D warnings && cargo test --locked
        working-directory: server
  dependencies:
    runs-on: ubuntu-latest
    container: rust:1-bookworm@sha256:ade39a710ef85f3506cffcfec3e8a24ba090badef1dff2fb798f71d878833fea
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: cargo install cargo-audit --locked --version 0.23.0
      - run: cargo audit --file server/Cargo.lock
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          # The action default includes the retired SDK package "tools".
          packages: 'platform-tools platforms;android-36 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - run: ./gradlew testDebugUnitTest assembleDebug lintDebug :app:assembleSandbox :app:lintSandbox
        working-directory: android
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker build -t pocketlog:implementation-check .
      - run: python3 scripts/smoke-private.py
