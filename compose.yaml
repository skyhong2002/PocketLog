services:
  server:
    build: .
    ports:
      - "127.0.0.1:18748:8080"
    volumes:
      - journal:/data
      - ai_settings:/config
    environment:
      POCKETLOG_AI_CONFIG_DIR: /config
    secrets:
      - owner_token
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid,nodev
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: 256m
    cpus: 1.0
    restart: unless-stopped
    stop_grace_period: 15s
  worker:
    build: .
    entrypoint: ["pocketlog-worker"]
    environment:
      POCKETLOG_AI_CONFIG_DIR: /config
    depends_on: [server]
    volumes:
      - journal:/data
      - ai_settings:/config:ro
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid,nodev
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 32
    mem_limit: 192m
    cpus: 0.5
    restart: unless-stopped
    stop_grace_period: 15s
secrets:
  owner_token:
    file: .secrets/owner_token
volumes:
  ai_settings:
  journal:
