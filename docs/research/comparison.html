let selected=new Set(projects.map(p=>p.id)),group='core';

function renderPicker(){const box=$('picker');box.replaceChildren();projects.forEach(p=>{const l=node('label',undefined,'toggle'),i=node('input');i.type='checkbox';i.checked=selected.has(p.id);i.onchange=()=>{i.checked?selected.add(p.id):selected.delete(p.id);render()};l.append(i,document.createTextNode(p.name));box.append(l)})}
function visible(){const q=$('query').value.trim().toLowerCase();return projects.filter(p=>selected.has(p.id)&&(!$('mobile').checked||p.mobile)&&(!$('shots').checked||(p.mobile&&p.fields.shots.kind==='yes'))&&(!q||[p.name,p.repo,p.conclusion,...Object.values(p.fields).flatMap(x=>[x.label,x.detail])].join(' ').toLowerCase().includes(q)))}

$('query').addEventListener('input',render);$('mobile').addEventListener('change',render);$('shots').addEventListener('change',render);$('close').onclick=()=>$('detail').close();$('detail').addEventListener('click',e=>{if(e.target===$('detail')){const r=$('detail').getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)$('detail').close()}});$('selectAll').onclick=()=>{selected=new Set(projects.map(p=>p.id));renderPicker();render()};$('clearAll').onclick=()=>{selected.clear();renderPicker();render()};$('reset').onclick=()=>{$('query').value='';$('mobile').checked=false;$('shots').checked=false;selected=new Set(projects.map(p=>p.id));group='core';renderTabs();renderPicker();render()};renderTabs();renderPicker();render();
